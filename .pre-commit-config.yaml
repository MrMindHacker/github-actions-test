      - id: pytest
        name: pytest
        entry: uv --directory python run pytest
        language: system
        types: [python]
        pass_filenames: false

      - id: pip-audit
        name: pip-audit
        entry: uv --directory python run pip-audit
        language: system
        types: [python]
        pass_filenames: false